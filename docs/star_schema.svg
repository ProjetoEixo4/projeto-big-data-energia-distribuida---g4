<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect width="680" height="560" fill="#ffffff"/>

<line x1="340" y1="100" x2="340" y2="220" stroke="#5F5E5A" stroke-width="1"/>
<line x1="340" y1="360" x2="340" y2="440" stroke="#5F5E5A" stroke-width="1"/>
<line x1="200" y1="290" x2="250" y2="290" stroke="#5F5E5A" stroke-width="1"/>
<line x1="430" y1="290" x2="480" y2="290" stroke="#5F5E5A" stroke-width="1"/>

<g>
<rect x="250" y="220" width="180" height="140" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="270" font-size="15" font-weight="bold" text-anchor="middle" fill="#26215C">FATO_GERACAO_</text>
<text x="340" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#26215C">DISTRIBUIDA</text>
<text x="340" y="315" font-size="11" text-anchor="middle" fill="#3C3489">potencia_instalada_kw</text>
<text x="340" y="332" font-size="11" text-anchor="middle" fill="#3C3489">qtd_modulos</text>
<text x="340" y="349" font-size="11" text-anchor="middle" fill="#3C3489">1 linha = 1 conexão</text>
</g>

<g>
<rect x="240" y="40" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#04342C">DIM_TEMPO</text>
<text x="340" y="83" font-size="11" text-anchor="middle" fill="#085041">ano, mes, trimestre</text>
</g>

<g>
<rect x="240" y="440" width="200" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="465" font-size="14" font-weight="bold" text-anchor="middle" fill="#4A1B0C">DIM_MODALIDADE</text>
<text x="340" y="483" font-size="11" text-anchor="middle" fill="#712B13">tipo_consumidor (uni/multi/rural)</text>
</g>

<g>
<rect x="20" y="255" width="180" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="285" font-size="14" font-weight="bold" text-anchor="middle" fill="#042C53">DIM_MUNICIPIO</text>
<text x="110" y="303" font-size="11" text-anchor="middle" fill="#0C447C">uf, pib_per_capita, populacao</text>
</g>

<g>
<rect x="480" y="255" width="180" height="70" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="570" y="285" font-size="14" font-weight="bold" text-anchor="middle" fill="#4B1528">DIM_DISTRIBUIDORA</text>
<text x="570" y="303" font-size="11" text-anchor="middle" fill="#72243E">nome_distribuidora, uf</text>
</g>

<text x="340" y="540" font-size="11" text-anchor="middle" fill="#5F5E5A">FATO_TARIFA e FATO_MATRIZ_ENERGETICA seguem o mesmo padrão, compartilhando DIM_TEMPO e DIM_DISTRIBUIDORA</text>
</svg>
